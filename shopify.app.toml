# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "9fcf4c60ff0052c701f4dc59be3034e3"
name = "Extend RR Starter"
application_url = "https://shopify-react-router-starter.personal-93c.workers.dev"
embedded = true

[webhooks]
api_version = "2026-10"

  # Shop lifecycle webhooks. Each topic has its own route in app/routes.
  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "shop/update" ]
  uri = "/webhooks/shop/update"

  # Mandatory compliance webhooks. Each topic has its own route in app/routes.
  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request" ]
  uri = "/webhooks/customers/data_request"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/redact" ]
  uri = "/webhooks/customers/redact"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products"

[auth]
redirect_urls = [ "https://shopify-react-router-starter.personal-93c.workers.dev/api/auth" ]

[build]
automatically_update_urls_on_dev = true
