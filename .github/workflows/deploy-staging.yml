name: Deploy staging

on:
  push:
    branches: [dev]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Check
        run: |
          pnpm run router-typegen
          pnpm run typecheck
          pnpm run lint
          pnpm run test

      - name: Apply D1 migrations
        run: pnpm run db:migrate:staging:remote
      - name: Deploy Worker
        run: pnpm run deploy:staging
      - name: Deploy Shopify app config and extensions
        run: >-
          pnpm exec shopify app deploy --config staging --allow-updates --no-input
          --source-control-url "${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
