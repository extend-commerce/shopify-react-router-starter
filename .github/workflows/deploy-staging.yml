name: Deploy staging

on:
  push:
    branches: [dev]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment: staging
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Apply D1 migrations
        run: pnpm run db:migrate:staging:remote
      - name: Deploy Worker
        run: pnpm run deploy:staging
      - name: Deploy Shopify app config and extensions
        run: >-
          pnpm exec shopify app deploy --config staging --allow-updates --no-input
          --source-control-url "${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
