name: Deploy production

# Runs when a `dev` -> `main` release PR is merged. The PR title picks the version.
on:
  pull_request:
    branches: [main]
    types: [closed]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Runs before the production approval, so a bad release fails without waiting on a reviewer.
  prepare:
    if: github.event.pull_request.merged && github.event.pull_request.head.ref == 'dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
      TITLE: ${{ github.event.pull_request.title }}
      DEV_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Read version from PR title
        id: version
        run: |
          if [[ ! "$TITLE" =~ ^release:\ (v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$ ]]; then
            echo "::error::PR title must be 'release: vX.Y.Z', got '$TITLE'"
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$version" > /dev/null 2>&1; then
            echo "::error::Tag $version already exists"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Require a successful staging deploy of the promoted commit
        run: |
          deployed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy-staging.yml \
            --commit "$DEV_SHA" --status success --json databaseId --jq length)
          if [[ "$deployed" == 0 ]]; then
            echo "::error::dev commit $DEV_SHA has no successful staging deploy"
            exit 1
          fi

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    # Add required reviewers to this environment in the repo settings.
    environment: production
    permissions:
      contents: write # pushes the release tag
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Apply D1 migrations
        run: pnpm run db:migrate:production:remote
      - name: Deploy Worker
        run: pnpm run deploy:production
      - name: Deploy Shopify app config and extensions
        run: >-
          pnpm exec shopify app deploy --config shopify.app.toml --allow-updates --no-input
          --version "$VERSION"
          --source-control-url "${{ github.server_url }}/${{ github.repository }}/commit/${{ github.event.pull_request.merge_commit_sha }}"

      - name: Tag release
        run: |
          git tag "$VERSION"
          git push origin "$VERSION"
