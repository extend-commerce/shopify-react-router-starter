# Staging app registration, deployed by .github/workflows/deploy-staging.yml.
# Production uses shopify.app.toml, which must point at a separate app.

client_id = "1df55f5cf6c0e80bff62b6563fdcd4cc"
name = "Extend RR Starter - Staging"
application_url = "https://shopify-react-router-starter-staging.personal-93c.workers.dev"
embedded = true

[webhooks]
api_version = "2026-10"

  # Mandatory compliance webhooks. Each topic has its own route in app/routes.
  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request" ]
  uri = "/webhooks/customers/data_request"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/redact" ]
  uri = "/webhooks/customers/redact"

  [[webhooks.subscriptions]]
  compliance_topics = [ "shop/redact" ]
  uri = "/webhooks/shop/redact"

[access_scopes]
scopes = "read_products"

[auth]
redirect_urls = [ "https://shopify-react-router-starter-staging.personal-93c.workers.dev/api/auth" ]

[build]
automatically_update_urls_on_dev = false
